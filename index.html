<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión Dinero — ¡Toma el control de tus finanzas!</title>
<style>
:root{--blue:#2563eb;--navy:#123b91;--green:#059669;--purple:#7c3aed;--ink:#172554;--muted:#64748b;--line:#dbeafe;--bg:#eef5ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#dbeafe,#f8fafc 50%,#d1fae5);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}
button,input{font:inherit}button{cursor:pointer;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.05);transform:translateY(-1px)}button:focus-visible,input:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.app{max-width:1050px;margin:24px auto;background:var(--bg);border:1px solid #bfdbfe;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #1e40af1c}
.top{background:linear-gradient(120deg,#123b91,#2563eb);color:#fff;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:20px;font-weight:950;letter-spacing:-.5px}.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800}.pill{background:#ffffff20;border:1px solid #ffffff45;padding:7px 10px;border-radius:99px}
.stage{padding:clamp(16px,4vw,32px);min-height:450px}.hero{background:linear-gradient(140deg,#dbeafe,#eff6ff 55%,#d1fae5);text-align:center;border-radius:18px;padding:25px 16px;margin-bottom:18px}.hero-icon{font-size:58px;line-height:1.25}h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:10px 0;color:var(--navy);font-weight:950}h2{font-size:clamp(21px,3vw,28px);margin:0 0 12px;font-weight:900}h3{font-size:17px;margin:0 0 8px}p{line-height:1.6}.muted{color:var(--muted);font-size:14px}.small{font-size:12px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:850;background:var(--blue);color:#fff;box-shadow:0 3px 0 #1d4ed8}.btn.green{background:var(--green);box-shadow:0 3px 0 #047857}.btn.purple{background:var(--purple);box-shadow:0 3px 0 #6d28d9}.btn.light{background:white;color:#1e40af;box-shadow:0 0 0 1px #bfdbfe}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.wide{width:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.actions>*{flex:1}.field{display:block;width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:white;color:var(--ink);margin:6px 0 12px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 4px 12px #1e40af0a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.world{padding:18px 13px;text-align:left;border:0;border-radius:17px;color:white;min-height:195px;display:flex;flex-direction:column;justify-content:space-between}.world .emoji{font-size:39px}.world strong{font-size:17px;line-height:1.25}.world small{opacity:.94}.w1{background:linear-gradient(145deg,#059669,#34d399)}.w2{background:linear-gradient(145deg,#1d4ed8,#60a5fa)}.w3{background:linear-gradient(145deg,#6d28d9,#c084fc)}.progress{height:9px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:9px 0 15px}.progress span{display:block;height:100%;background:#10b981;border-radius:99px;transition:width .3s}.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid #e2e8f0;background:white;color:var(--ink);padding:13px;border-radius:12px;margin-top:9px;line-height:1.45}.choice .letter{flex:none;width:27px;height:27px;border-radius:8px;background:#eff6ff;color:#1d4ed8;font-weight:900;display:grid;place-items:center}.choice.selected{border-color:var(--blue);background:#eff6ff}.choice.correct{border-color:var(--green);background:#ecfdf5}.choice.wrong{border-color:#f59e0b;background:#fffbeb}.feedback{border-radius:13px;padding:14px;margin-top:14px;background:#ecfdf5;border:1px solid #a7f3d0;line-height:1.55}.feedback.neutral{background:#eff6ff;border-color:#bfdbfe}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:#f8fafc;border-radius:12px;padding:13px;text-align:center}.metric b{display:block;font-size:24px;color:#1d4ed8}.badge-card{background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:13px;text-align:center}.badge-card span{font-size:27px;display:block}.playerrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #e2e8f0}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:850}.center{text-align:center}.footer{background:#dbeafe;padding:11px 17px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;color:#1e40af;font-size:12px}.notice{padding:11px 13px;border-radius:11px;background:#fef3c7;color:#92400e;font-size:13px;line-height:1.5}
@media(max-width:620px){.app{margin:0;border-radius:0;min-height:100vh}.grid{grid-template-columns:1fr}.world{min-height:145px;display:grid;grid-template-columns:54px 1fr;column-gap:10px;align-items:center}.world .emoji{grid-row:span 2}.world strong{font-size:16px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{min-height:400px}.top{padding:13px}.actions>*{min-width:40%}}
@media print{body{background:white}.app{margin:0;box-shadow:none;border:0}.top,.footer,.actions,#resetButton{display:none!important}.stage{padding:0}.hero{border:1px solid #ccc}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">🪙 MISIÓN DINERO</div><div class="stats" id="stats"><span class="pill">👤 Invitado</span><span class="pill">⭐ 0 XP</span><span class="pill">🪙 1.000</span></div></header>
<main class="stage" id="stage" aria-live="polite"></main>
<footer class="footer"><span>🎮 Aprende jugando · Simulación educativa</span><span>El progreso se guarda en esta sesión del navegador.</span><button class="btn light small" id="resetButton" style="padding:5px 9px;box-shadow:none">↻ Reiniciar</button></footer>
</div>
<script>
"use strict";
const worlds=[
{name:"El poder del ahorro",icon:"🐷",cls:"w1",desc:"Crea metas, organiza tu mesada y prepárate para imprevistos.",badge:"Maestro del Ahorro",
missions:[
{q:"Recibes 100 monedas y quieres una bicicleta de 400. ¿Qué plan te ayuda más?",opts:["Gastar las 100 hoy.","Guardar una cantidad cada semana y seguir la meta.","Esperar que alguien te la regale."],a:1,why:"Una meta con un plan de ahorro convierte un deseo en un objetivo alcanzable.",delta:40},
{q:"Tienes 200 monedas. Necesitas transporte para estudiar y quieres comprar una gorra. ¿Qué priorizas?",opts:["La gorra, porque te gusta más.","El transporte necesario y luego revisar lo que queda.","Gastar todo sin calcular."],a:1,why:"Distinguir necesidades de deseos ayuda a cuidar el dinero para lo importante.",delta:30},
{q:"Ahorraste 250 monedas. Aparece un gasto escolar inesperado de 80. ¿Qué haces?",opts:["Usar una parte del ahorro y ajustar el plan.","Gastar también todo lo demás.","Ignorar el gasto aunque sea necesario."],a:0,why:"Un ahorro disponible ayuda a afrontar imprevistos sin desordenar todo el presupuesto.",delta:-80},
{q:"Tu mesada es de 300 monedas por semana. ¿Cómo comienzas a organizarla?",opts:["Gastando primero y calculando al final.","Separando dinero para necesidades, ahorro y gustos.","Prestando todas las monedas."],a:1,why:"Un presupuesto sencillo te permite asignar dinero a cada propósito antes de gastarlo.",delta:35},
{q:"Una oferta anuncia un juguete que no necesitas. ¿Qué decisión demuestra planificación?",opts:["Comprar porque dice «oferta».","Pedir prestado para aprovecharla.","Pensar si lo necesitas y si afecta tu meta."],a:2,why:"Un descuento no es ahorro si compras algo que no necesitas y perjudica tus objetivos.",delta:0}
],quiz:[
["¿Qué es una meta de ahorro?",["Un gasto sorpresa","Un objetivo para el que reservas dinero","Un préstamo"],1,"Una meta indica para qué y cuánto quieres ahorrar."],
["¿Cuál es una necesidad?",["Un capricho del momento","Un accesorio de moda","El transporte necesario para ir a estudiar"],2,"Las necesidades son gastos importantes para la vida cotidiana."],
["¿Para qué sirve un presupuesto?",["Para planear ingresos y gastos","Para gastar más de lo que tienes","Para evitar contar el dinero"],0,"Un presupuesto organiza el dinero disponible."],
["¿Qué ayuda a afrontar imprevistos?",["Comprar por impulso","Un ahorro de emergencia","Gastar todos los ingresos"],1,"Una reserva puede ayudar cuando surge un gasto inesperado."],
["¿Qué conviene hacer con una meta grande?",["Abandonarla de inmediato","Usar todos los ahorros en otra cosa","Dividirla en pasos y ahorrar regularmente"],2,"Los pasos pequeños hacen que una meta sea más fácil de planear."]
]},
{name:"Domina tu dinero",icon:"👛",cls:"w2",desc:"Aprende a comparar precios, controlar gastos y equilibrar tu presupuesto.",badge:"Experto en Presupuestos",
missions:[
{q:"Tienes 500 monedas. Gastas 150 en comida y 100 en transporte. ¿Cuál es tu saldo?",opts:["250 monedas","350 monedas","400 monedas"],a:0,why:"Saldo = dinero inicial menos gastos: 500 − 150 − 100 = 250 monedas.",delta:25},
{q:"Una botella cuesta 80 monedas en una tienda y 65 en otra. Tienen la misma cantidad y calidad. ¿Qué haces?",opts:["Pagas 80 sin mirar.","Comparas el precio total y eliges la opción que te conviene.","Compras ambas sin necesitarlas."],a:1,why:"Comparar precios y comprobar que el producto sea equivalente ayuda a decidir con información.",delta:25},
{q:"Tienes 300 monedas para la semana. Tus gastos necesarios suman 220. ¿Qué plan es más razonable?",opts:["Gastar 300 en entretenimiento.","Ignorar los gastos necesarios.","Cubrir los 220 y planear los 80 restantes."],a:2,why:"Primero se cubren las necesidades; después se decide qué hacer con el saldo.",delta:30},
{q:"Recibes 100 monedas inesperadas. ¿Qué opción muestra una buena gestión?",opts:["Revisar tu presupuesto y repartirlas entre prioridades.","Gastarlas todas inmediatamente.","Suponer que recibirás 100 cada día."],a:0,why:"Un ingreso extra se puede distribuir entre metas, necesidades y ahorro sin contar con que se repetirá.",delta:40},
{q:"Tu plan tenía 50 monedas para ocio, pero ya gastaste 45. ¿Qué haces antes de otra compra de 20?",opts:["Comprar sin revisar.","Comprobar el saldo y elegir una alternativa que puedas pagar.","Pedir prestadas 15 monedas siempre."],a:1,why:"Revisar el saldo evita gastar dinero que ya está comprometido.",delta:0}
],quiz:[
["¿Qué es un ingreso?",["Dinero que recibes","Dinero que gastas","Una etiqueta de precio"],0,"Una mesada o un pago recibido son ejemplos de ingresos."],
["¿Cómo calculas el saldo?",["Sumando los gastos sin revisar","Ingresos menos gastos","Precio por descuento"],1,"El saldo es lo que queda después de descontar los gastos del dinero disponible."],
["Un artículo baja de 200 a 150 monedas. ¿Cuánto descuentan?",["25 monedas","75 monedas","50 monedas"],2,"200 − 150 = 50 monedas de descuento."],
["¿Qué es un gasto innecesario en tu presupuesto actual?",["Un gasto que no aporta a tus prioridades y puedes evitar","Cualquier alimento","Todo gasto de transporte"],0,"Depende de tus necesidades y objetivos: revisar prioridades ayuda a identificar gastos prescindibles."],
["¿Qué significa tener un fondo de emergencia?",["Dinero reservado para imprevistos","Dinero destinado solo a regalos","Un crédito que debes pedir"],0,"Es una reserva para gastos inesperados; no reemplaza un presupuesto."]
]},
{name:"Exploradores de la inversión",icon:"📈",cls:"w3",desc:"Explora el riesgo, el rendimiento y la diversificación sin dinero real.",badge:"Inversionista Inteligente",
missions:[
{q:"¿Cuál es la diferencia entre ahorrar e invertir?",opts:["Son exactamente lo mismo.","Ahorrar reserva dinero; invertir busca rendimiento y puede implicar pérdidas.","Invertir garantiza ganancias."],a:1,why:"El ahorro prioriza disponer del dinero; una inversión busca crecer, pero su valor puede bajar.",delta:25},
{q:"En una simulación, una inversión sube un 10 % de 200 monedas. ¿Cuánto vale ahora?",opts:["210 monedas","220 monedas","240 monedas"],a:1,why:"El 10 % de 200 es 20; 200 + 20 = 220 monedas.",delta:20},
{q:"Tienes 300 monedas ficticias para aprender sobre inversiones. ¿Qué enseña diversificar?",opts:["Poner todo en una sola opción.","Elegir solo la opción que subió ayer.","Repartir entre distintas opciones para no depender de una sola."],a:2,why:"La diversificación reduce la dependencia de un único activo, aunque no elimina el riesgo.",delta:30},
{q:"Una inversión ficticia pierde 40 monedas de valor. ¿Qué conclusión es razonable?",opts:["Las inversiones pueden perder valor; conviene comprender el riesgo.","Toda inversión recupera su valor mañana.","Hay que invertir todo para recuperarlo rápido."],a:0,why:"Las pérdidas son posibles. Perseguirlas asumiendo más riesgos puede empeorar el resultado.",delta:-20},
{q:"Un personaje promete duplicar tus monedas con ganancia garantizada y sin riesgo. ¿Qué haces?",opts:["Le entregas todas tus monedas.","Desconfías de la promesa y verificas la información con un adulto de confianza.","Invitas a tus amigos a enviarle dinero."],a:1,why:"Toda inversión implica algún riesgo y las promesas de ganancias garantizadas extraordinarias son señales de alerta.",delta:0}
],quiz:[
["¿Qué es el rendimiento?",["El número de compras","El resultado que produce una inversión","Una moneda de juguete"],1,"El rendimiento representa la ganancia o pérdida respecto a una cantidad invertida."],
["¿Qué significa riesgo financiero?",["La posibilidad de que el resultado sea distinto al esperado, incluso una pérdida","Una ganancia segura","Una forma de evitar todo cambio"],0,"El riesgo es la posibilidad de que ocurra un resultado desfavorable."],
["¿Qué hace la diversificación?",["Garantiza ganancias","Elimina cualquier riesgo","Reparte recursos entre distintas opciones"],2,"Diversificar reduce la concentración, pero no garantiza que no haya pérdidas."],
["¿Qué afirmación sobre las inversiones es correcta?",["Siempre generan ganancias","Pueden subir o bajar de valor","Nunca necesitan investigación"],1,"Los resultados son inciertos; comprender riesgos es esencial."],
["¿Qué es más prudente ante una oferta financiera sospechosa?",["Verificar la información y consultar a un adulto de confianza","Enviar dinero enseguida","Creerla porque tiene muchos seguidores"],0,"La verificación y la orientación confiable ayudan a evitar fraudes."]
]}
];
const $=id=>document.getElementById(id),stage=$("stage"),stats=$("stats");
let players=[],current=0,screen="welcome",worldIndex=0,missionIndex=0,quizIndex=0,selected=-1,answered=false,correctAnswers=0,totalAnswers=0,sessionHistory=[];
function player(){return players[current]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){try{sessionStorage.setItem("misionDinero",JSON.stringify({players,current,screen,worldIndex,missionIndex,quizIndex,correctAnswers,totalAnswers,sessionHistory}))}catch(e){}}
function updateStats(){let p=player();stats.innerHTML=`<span class="pill">👤 ${esc(p?p.name:"Invitado")}</span><span class="pill">⭐ ${p?p.xp:0} XP</span><span class="pill">🪙 ${(p?p.coins:1000).toLocaleString("es-CO")}</span>`}
function goHome(){screen="menu";render()}
function initPlayers(names){players=names.map(name=>({name,coins:1000,xp:0,correct:0,answered:0,worlds:[0,0,0],badges:[],done:[]}));current=0;correctAnswers=0;totalAnswers=0;sessionHistory=[];screen="greeting";render()}
function render(){updateStats();save();({welcome,register,greeting,menu,mission,quiz,worlddone,results,leaderboard,collaboration}[screen]||welcome)()}
function welcome(){stage.innerHTML=`<section class="hero"><div class="hero-icon">🚀🪙</div><h1>Misión Dinero</h1><h2>¡Toma el control de tus finanzas!</h2><p>Explora tres mundos, resuelve retos, protege tus monedas y descubre cómo tomar decisiones financieras inteligentes.</p><span class="tag">PARA EXPLORADORES DE 13 A 15 AÑOS</span></section><section class="card center"><h2>¿Listo para la aventura?</h2><p class="muted">15 misiones · 15 preguntas de evaluación · Recompensas · Modo grupal</p><button class="btn green wide" id="start">🚀 ¡Comenzar!</button><p class="muted small">Todo es una simulación educativa. No necesitas dinero real.</p></section>`;$("start").onclick=()=>{screen="register";render()}}
function register(){stage.innerHTML=`<section class="card"><span class="tag">PASO 1 · REGISTRO</span><h2 style="margin-top:12px">👋 ¿Quién juega hoy?</h2><p class="muted">Escribe tu nombre. Puedes agregar a tus compañeros para compartir el dispositivo por turnos.</p><form id="form"><label for="name"><b>Nombre del jugador</b></label><input class="field" id="name" maxlength="24" required placeholder="Ej. Laura" autocomplete="off"><div id="names" class="muted">Jugadores añadidos: ninguno</div><div class="actions"><button type="button" class="btn light" id="add">＋ Agregar jugador</button><button class="btn green" type="submit">Guardar nombre y comenzar →</button></div></form><p class="muted small">Utiliza solo un nombre de pila o apodo; no incluyas datos personales sensibles.</p></section>`;let names=[];const input=$("name"),list=$("names");function refresh(){list.innerHTML="<b>Jugadores añadidos:</b> "+(names.map(esc).join(" · ")||"ninguno")+" <span class=small>(máximo 8)</span>"}function add(){let n=input.value.trim();if(!n){input.focus();return}if(names.length>=8){list.textContent="Puedes agregar hasta 8 jugadores.";return}if(names.some(x=>x.toLowerCase()===n.toLowerCase())){list.textContent="Ese nombre ya está en la lista. Prueba otro.";return}names.push(n);input.value="";refresh();input.focus()}$("add").onclick=add;$("form").onsubmit=e=>{e.preventDefault();if(input.value.trim()&&names.length<8)add();if(names.length)initPlayers(names)}}
function greeting(){stage.innerHTML=`<section class="hero"><div class="hero-icon">🎉👋</div><h1>¡Hola, ${esc(player().name)}!</h1><p>¿Listo para convertirte en un explorador de las finanzas?</p><p>Tu aventura comienza con <b>1.000 monedas virtuales</b> y una oportunidad para aprender.</p></section><button class="btn green wide" id="continue">¡Vamos al menú principal! →</button>`;$("continue").onclick=goHome}
function menu(){let p=player();stage.innerHTML=`<span class="tag">CENTRO DE MISIONES</span><h2 style="margin-top:10px">¡A elegir aventura, ${esc(p.name)}!</h2><p class="muted">Completa las cinco misiones y el cuestionario de cada mundo. Las monedas y la experiencia se contabilizan por separado.</p><div class="grid">${worlds.map((w,i)=>`<button class="world ${w.cls}" data-world="${i}"><span class="emoji">${w.icon}</span><strong>MUNDO ${i+1}<br>${w.name}</strong><small>${w.desc}</small><small>Progreso: ${p.worlds[i]}/6 pasos</small><div class="progress"><span style="width:${p.worlds[i]/6*100}%"></span></div></button>`).join("")}</div><div class="actions"><button class="btn light" id="board">🏆 Clasificación</button><button class="btn purple" id="collab">🤝 Reto colaborativo</button><button class="btn green" id="results">🎓 Mis resultados</button></div>`;stage.querySelectorAll("[data-world]").forEach(b=>b.onclick=()=>startWorld(+b.dataset.world));$("board").onclick=()=>{screen="leaderboard";render()};$("collab").onclick=()=>{screen="collaboration";render()};$("results").onclick=()=>{screen="results";render()}}
function startWorld(i){worldIndex=i;let p=player();if(!p.done.includes(i)){missionIndex=0;selected=-1;answered=false;screen="mission";render()}else{screen="worlddone";render()}}
function mission(){let p=player(),w=worlds[worldIndex],m=w.missions[missionIndex];stage.innerHTML=`<button class="btn light small" id="back">← Menú</button><div style="margin-top:14px" class="tag">MUNDO ${worldIndex+1} · MISIÓN ${missionIndex+1} DE 5</div><div class="progress"><span style="width:${missionIndex/5*100}%;background:${["#059669","#2563eb","#7c3aed"][worldIndex]}"></span></div><section class="card"><div style="font-size:35px">${w.icon}</div><h2>${w.name}</h2><p>${m.q}</p><div id="options">${m.opts.map((o,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join("")}</div><div id="feedback"></div><div class="actions"><button id="answer" class="btn green" disabled>Confirmar respuesta</button><button id="next" class="btn" disabled>${missionIndex===4?"Ir al cuestionario →":"Siguiente reto →"}</button></div></section><p class="muted small">🪙 Monedas: ${p.coins.toLocaleString("es-CO")} · ⭐ Experiencia: ${p.xp} XP.</p>`;$("back").onclick=goHome;stage.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.choice;stage.querySelectorAll("[data-choice]").forEach(x=>x.classList.toggle("selected",x===b));$("answer").disabled=false});$("answer").onclick=answerMission;$("next").onclick=()=>{if(missionIndex<4){missionIndex++;selected=-1;answered=false;render()}else{quizIndex=0;selected=-1;answered=false;screen="quiz";render()}}}
function answerMission(){if(answered||selected<0)return;answered=true;let p=player(),m=worlds[worldIndex].missions[missionIndex],ok=selected===m.a,change=ok?Math.max(10,m.delta):0;p.answered++;totalAnswers++;p.correct+=ok?1:0;correctAnswers+=ok?1:0;p.coins=Math.max(0,p.coins+change);p.xp+=ok?20:8;p.worlds[worldIndex]=Math.max(p.worlds[worldIndex],missionIndex+1);sessionHistory.push({player:p.name,world:worldIndex,correct:ok});stage.querySelectorAll("[data-choice]").forEach((b,i)=>{b.disabled=true;if(i===m.a)b.classList.add("correct");if(i===selected&&i!==m.a)b.classList.add("wrong")});$("feedback").innerHTML=`<div class="feedback ${ok?"":"neutral"}"><b>${ok?"🌟 ¡Buena decisión!":"💡 ¡Cada intento te enseña algo!"}</b><br>${m.why}<br><b>Impacto:</b> ${ok?"+"+change+" monedas virtuales y +20 XP.":"+8 XP por participar y reflexionar."}</div>`;$("answer").disabled=true;$("next").disabled=false;updateStats();save()}
function quiz(){let p=player(),w=worlds[worldIndex],q=w.quiz[quizIndex];stage.innerHTML=`<button class="btn light small" id="back">← Menú</button><div style="margin-top:12px" class="tag">CUESTIONARIO · MUNDO ${worldIndex+1} · ${quizIndex+1} DE 5</div><div class="progress"><span style="width:${quizIndex/5*100}%"></span></div><section class="card"><h2>🧠 Comprueba lo que aprendiste</h2><p>${q[0]}</p><div id="options">${q[1].map((o,i)=>`<button class="choice" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`).join("")}</div><div id="feedback"></div><div class="actions"><button class="btn green" id="answer" disabled>Responder</button><button class="btn" id="next" disabled>${quizIndex===4?"Terminar mundo →":"Siguiente pregunta →"}</button></div></section>`;$("back").onclick=goHome;stage.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{if(answered)return;selected=+b.dataset.choice;stage.querySelectorAll("[data-choice]").forEach(x=>x.classList.toggle("selected",x===b));$("answer").disabled=false});$("answer").onclick=answerQuiz;$("next").onclick=()=>{if(quizIndex<4){quizIndex++;selected=-1;answered=false;render()}else finishWorld()}}
function answerQuiz(){if(answered||selected<0)return;answered=true;let p=player(),q=worlds[worldIndex].quiz[quizIndex],ok=selected===q[2];p.answered++;totalAnswers++;p.correct+=ok?1:0;correctAnswers+=ok?1:0;p.xp+=ok?20:8;if(ok)p.coins+=15;stage.querySelectorAll("[data-choice]").forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===selected&&i!==q[2])b.classList.add("wrong")});$("feedback").innerHTML=`<div class="feedback ${ok?"":"neutral"}"><b>${ok?"✅ ¡Correcto! +15 monedas y +20 XP":"📘 Sigue aprendiendo: +8 XP"}</b><br>${q[3]}</div>`;$("answer").disabled=true;$("next").disabled=false;updateStats();save()}
function finishWorld(){let p=player(),badge=worlds[worldIndex].badge;if(!p.done.includes(worldIndex))p.done.push(worldIndex);p.worlds[worldIndex]=6;if(!p.badges.includes(badge))p.badges.push(badge);screen="worlddone";render()}
function worlddone(){let p=player(),w=worlds[worldIndex];stage.innerHTML=`<section class="hero"><div class="hero-icon">🏆✨</div><h1>¡Mundo completado!</h1><h2>${w.name}</h2><p>Has practicado conceptos financieros y completado las cinco misiones y el cuestionario.</p></section><div class="grid"><div class="badge-card"><span>🎖️</span><b>${w.badge}</b><p class="small">Insignia obtenida</p></div><div class="card center"><span class="muted">Monedas disponibles</span><h2>🪙 ${p.coins.toLocaleString("es-CO")}</h2></div><div class="card center"><span class="muted">Experiencia</span><h2>⭐ ${p.xp} XP</h2></div></div><div class="actions"><button class="btn light" id="menu">Volver al menú</button><button class="btn green" id="nextworld">${worldIndex<2?"Explorar siguiente mundo →":"Ver certificado final 🎓"}</button></div>`;$("menu").onclick=goHome;$("nextworld").onclick=()=>{if(worldIndex<2)startWorld(worldIndex+1);else{screen="results";render()}}}
function leaderboard(){let sorted=[...players].sort((a,b)=>b.xp-a.xp);stage.innerHTML=`<button class="btn light small" id="back">← Menú</button><section class="hero" style="margin-top:12px"><div class="hero-icon">🏅</div><h2>Clasificación amistosa</h2><p>¡Celebramos el aprendizaje, no solo el resultado!</p></section><section class="card">${sorted.map((p,i)=>`<div class="playerrow"><span><b>${i+1}. ${esc(p.name)}</b><br><span class="muted small">${p.done.length}/3 mundos · ${p.badges.length} insignias</span></span><span><b>${p.xp} XP</b><br><span class="muted small">🪙 ${p.coins}</span></span></div>`).join("")}<p class="muted small">Los puntos de experiencia miden el aprendizaje; las monedas son un saldo de simulación.</p></section>`;$("back").onclick=goHome}
function collaboration(){stage.innerHTML=`<button class="btn light small" id="back">← Menú</button><section class="hero" style="margin-top:12px"><div class="hero-icon">🤝💰</div><h2>Reto colaborativo: presupuesto común</h2><p>El equipo dispone de 1.000 monedas virtuales para planear una actividad.</p></section><section class="card"><p>Distribuyan las 1.000 monedas. La suma debe ser exactamente 1.000.</p><div>${[["Materiales",250],["Comida y agua",250],["Transporte",200],["Reserva para imprevistos",200],["Diversión",100]].map((x,i)=>`<label for="b${i}"><b>${x[0]}</b> <span id="v${i}">${x[1]}</span> monedas</label><input class="field" type="range" min="0" max="600" step="50" value="${x[1]}" id="b${i}">`).join("")}</div><h3>Total: <span id="total">1.000</span> / 1.000 monedas</h3><div class="progress"><span id="bar" style="width:100%"></span></div><div id="teamFeedback" class="muted">Ajusten los valores y acuerden sus prioridades.</div><button id="submitTeam" class="btn green wide">Confirmar plan del equipo</button></section>`;$("back").onclick=goHome;let ranges=[...stage.querySelectorAll('input[type="range"]')];function calc(){let sum=0;ranges.forEach((r,i)=>{sum+=+r.value;$("v"+i).textContent=r.value});$("total").textContent=sum.toLocaleString("es-CO");$("bar").style.width=Math.min(100,sum/10)+"%";$("submitTeam").disabled=sum!==1000;$("teamFeedback").textContent=sum===1000?"¡Presupuesto equilibrado! Revisen si cubre las necesidades y deja una reserva.":"Faltan o sobran "+Math.abs(1000-sum)+" monedas para alcanzar el total."}ranges.forEach(r=>r.oninput=calc);$("submitTeam").onclick=()=>{players.forEach(p=>p.xp+=25);$("teamFeedback").innerHTML="<b>🎉 ¡Plan acordado!</b> El equipo recibe +25 XP por persona. Han practicado planificación, prioridades y colaboración.";$("submitTeam").disabled=true;updateStats();save()}}
function results(){let p=player(),accuracy=p.answered?Math.round(p.correct/p.answered*100):0,completed=p.done.length===3;stage.innerHTML=`<section class="hero"><div class="hero-icon">${completed?"🎓🏆":"🧭✨"}</div><h1>${completed?"¡Misión cumplida!":"Tu aventura financiera"}</h1><p>${esc(p.name)}, ${completed?"has completado los tres mundos y desarrollado nuevas habilidades financieras.":"sigue explorando los mundos para conseguir tu certificado de misión completa."}</p></section><div class="metric-grid"><div class="metric"><b>${p.xp}</b><span>⭐ XP</span></div><div class="metric"><b>${accuracy}%</b><span>Respuestas correctas</span></div><div class="metric"><b>${p.coins.toLocaleString("es-CO")}</b><span>🪙 Monedas restantes</span></div><div class="metric"><b>${p.done.length}/3</b><span>Mundos completados</span></div><div class="metric"><b>${p.answered}</b><span>Respuestas dadas</span></div><div class="metric"><b>${p.badges.length}</b><span>Insignias obtenidas</span></div></div><h2 style="margin-top:20px">🎖️ Tus insignias</h2><div class="grid">${worlds.map(w=>`<div class="badge-card"><span>${w.icon}</span><b>${w.badge}</b><p class="small">${p.badges.includes(w.badge)?"¡Conseguida!":"Completa el mundo para conseguirla."}</p></div>`).join("")}</div><section class="card" style="margin-top:14px"><h2>🌱 Habilidades que estás desarrollando</h2><p>✓ Establecer metas y planificar el ahorro<br>✓ Diferenciar necesidades y deseos<br>✓ Organizar ingresos, gastos y saldo<br>✓ Prepararte para imprevistos<br>✓ Comprender el riesgo y la diversificación</p><h3>Tu siguiente paso</h3><p>Prueba a crear un presupuesto para una meta personal ficticia, compara precios antes de comprar y conversa con un adulto de confianza si tienes dudas sobre decisiones financieras.</p></section>${completed?`<section class="card center" style="margin-top:14px;border:3px double #fbbf24;background:#fffbeb"><div style="font-size:38px">🏅</div><h2>¡Misión cumplida!</h2><h3>Certificado simbólico de aprendizaje</h3><p>Se reconoce a <b>${esc(p.name)}</b> por completar Misión Dinero y practicar nuevas habilidades financieras.</p><p>⭐ ${p.xp} XP · ${accuracy}% de respuestas correctas</p><p class="muted small">Certificado educativo no oficial.</p><button class="btn" id="print">🖨️ Imprimir / guardar como PDF</button></section>`:""}<div class="actions"><button class="btn light" id="menu">Volver a los mundos</button><button class="btn green" id="board">Ver clasificación</button><button class="btn purple" id="restart">Nueva partida</button></div>`;$("menu").onclick=goHome;$("board").onclick=()=>{screen="leaderboard";render()};$("restart").onclick=()=>{players=[];screen="welcome";render()};if($("print"))$("print").onclick=()=>window.print()}
$("resetButton").onclick=()=>{if(confirm("¿Quieres reiniciar la partida y borrar el progreso de esta sesión?")){players=[];current=0;correctAnswers=0;totalAnswers=0;sessionHistory=[];try{sessionStorage.removeItem("misionDinero")}catch(e){}screen="welcome";render()}};
render();
</script>
</body>
</html>
